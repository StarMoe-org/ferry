name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build web SPA
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Go vet and race tests
        run: |
          go vet ./...
          go test -race -v ./...

      - name: Build static binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/ferry ./cmd/ferry
          ./bin/ferry version

      - name: Build container image
        run: docker build -t ferry:ci .
