apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferry
  namespace: app
  labels:
    app.kubernetes.io/name: ferry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ferry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferry
    spec:
      serviceAccountName: ferry
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ferry
          image: ghcr.io/exmeaning/ferry:latest
          args: ["-config", "/etc/ferry/ferry.yaml"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: ferry-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/ferry
              readOnly: true
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: ferry-config
        - name: work
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ferry
  namespace: app
spec:
  selector:
    app.kubernetes.io/name: ferry
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ferry
  namespace: app
spec:
  rules:
    - host: ferry.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ferry
                port:
                  name: http
