apiVersion: v1
kind: ServiceAccount
metadata:
  name: ferry
  namespace: app
automountServiceAccountToken: false
---
# Core deployer role: strictly get/list/patch workloads + Ferry's own state ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ferry-deployer
  namespace: app
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["ferry-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ferry-deployer
  namespace: app
subjects:
  - kind: ServiceAccount
    name: ferry
    namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ferry-deployer
---
# Optional snapshot role: apply ONLY in namespaces where GitOps snapshots are enabled.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ferry-snapshotter
  namespace: app
rules:
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["traefik.io"]
    resources: ["middlewares"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ferry-snapshotter
  namespace: app
subjects:
  - kind: ServiceAccount
    name: ferry
    namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ferry-snapshotter
