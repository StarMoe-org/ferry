# Apply on each remote Kubernetes cluster that Ferry manages.
# Export its CA certificate and a bound ServiceAccount token Secret into Ferry's cluster secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ferry-remote
  namespace: app
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: ferry-remote-token
  namespace: app
  annotations:
    kubernetes.io/service-account.name: ferry-remote
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ferry-remote-deployer
  namespace: app
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ferry-remote-deployer
  namespace: app
subjects:
  - kind: ServiceAccount
    name: ferry-remote
    namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ferry-remote-deployer
---
# Optional: bind only when snapshots are enabled for this remote cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ferry-remote-snapshotter
  namespace: app
rules:
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["traefik.io"]
    resources: ["middlewares"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ferry-remote-snapshotter
  namespace: app
subjects:
  - kind: ServiceAccount
    name: ferry-remote
    namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ferry-remote-snapshotter
